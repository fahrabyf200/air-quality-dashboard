name: CI — Lint, Type-check & Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    name: 🔍 CI Pipeline
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      # 1. Checkout kode
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # 3. Install dependencies
      - name: 📦 Install dependencies
        run: npm ci

      # 4. Run ESLint
      - name: 🧹 Run ESLint
        run: npm run lint

      # 5. Run TypeScript type-check
      - name: 🔷 TypeScript type-check
        run: npm run type-check

      # 6. Build Next.js
      - name: 🏗️ Build Next.js application
        run: npm run build
        env:
          # Env vars diambil dari GitHub Secrets (set di: Settings > Secrets > Actions)
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          NEXT_TELEMETRY_DISABLED: 1

      # 7. Upload build artifact (opsional, untuk debugging)
      - name: 📤 Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1
