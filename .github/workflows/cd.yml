name: SkyWatch CI/CD to Vercel

on:
  push:
    branches: ["main", "master"]

jobs:
  build-and-deploy:
    name: 🚀 Build Docker & Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode
      - name: 📥 Checkout Code
        uses: actions/checkout@v4  # ✅ Node.js 24 compatible (was @v3)

      # 2. TAHAP CI: Login ke Docker Hub
      - name: 🐳 Login to Docker Hub
        uses: docker/login-action@v3  # ✅ Node.js 24 compatible (was @v2)
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Setup Docker Buildx
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build dan Push Docker Image
      - name: 🏗️ Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .          # Root repo sebagai build context
          file: ./Dockerfile  # Path eksplisit ke Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/skywatch-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ✅ build-args = diteruskan MASUK ke dalam Docker build
          build-args: |
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}

      # 5. TAHAP CD: Deploy ke Vercel (Production) via Vercel CLI resmi
      - name: 📦 Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 🌐 Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🏗️ Build Project via Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🚀 Deploy to Vercel Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
