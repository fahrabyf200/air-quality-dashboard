name: SkyWatch — Deploy to Vercel

# =============================================================
# Pipeline ini dijalankan setiap push ke main/master.
# Fokus: Deploy cepat ke Vercel (~1-2 menit).
# Docker build dipisah ke docker-release.yml (hanya saat tag).
# =============================================================

on:
  push:
    branches: ["main", "master"]

jobs:
  deploy-vercel:
    name: 🚀 Deploy to Vercel Production
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # 2. Install Vercel CLI
      - name: 📦 Install Vercel CLI
        run: npm install --global vercel@latest

      # 3. Pull environment variables dari Vercel
      - name: 🌐 Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # 4. Build project via Vercel
      - name: 🏗️ Build Project via Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # 5. Deploy ke Vercel Production
      - name: 🚀 Deploy to Vercel Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  health-check:
    name: 🏥 Health Check (Informational)
    runs-on: ubuntu-latest
    needs: deploy-vercel
    continue-on-error: true

    steps:
      # Tunggu lebih singkat — Vercel biasanya siap dalam 20 detik
      - name: ⏳ Tunggu Instance Siap (20 detik)
        run: sleep 20

      - name: 🔍 Cek Health Endpoint
        run: |
          APP_URL="${{ secrets.VERCEL_APP_URL }}"

          if [ -z "$APP_URL" ]; then
            echo "ℹ️  VERCEL_APP_URL belum diset — health check dilewati."
            echo "💡 Set di: GitHub Repo → Settings → Secrets → Actions"
            exit 0
          fi

          echo "🌐 Mengecek: $APP_URL/api/health"

          HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" \
            --max-time 10 "$APP_URL/api/health" || echo "000")

          echo "📊 HTTP $HTTP_CODE"
          cat /tmp/health.json | python3 -m json.tool 2>/dev/null || cat /tmp/health.json

          if   [ "$HTTP_CODE" = "200" ]; then echo "✅ Sistem sehat!"
          elif [ "$HTTP_CODE" = "401" ]; then echo "⚠️ Protected by Vercel Auth (expected on Hobby plan)"
          else echo "⚠️ HTTP $HTTP_CODE — cek Vercel Dashboard"; fi
