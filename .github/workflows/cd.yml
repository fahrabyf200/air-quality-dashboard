name: SkyWatch CI/CD to Vercel

on:
  push:
    branches: ["main", "master"]

jobs:
  build-docker:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # ✅ Diperlukan untuk push ke ghcr.io

    steps:
      # 1. Checkout kode
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # 2. Login ke GitHub Container Registry (pakai GITHUB_TOKEN bawaan - tidak perlu secrets)
      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Setup Docker Buildx
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build dan Push Docker Image ke ghcr.io
      - name: 🏗️ Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/skywatch-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}

  deploy-vercel:
    name: 🚀 Deploy to Vercel Production
    runs-on: ubuntu-latest
    needs: build-docker  # ✅ Jalankan setelah Docker build sukses

    steps:
      # 1. Checkout kode
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # 2. Deploy ke Vercel via Vercel CLI resmi
      - name: 📦 Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 🌐 Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🏗️ Build Project via Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🚀 Deploy to Vercel Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
