name: SkyWatch — Build & Release Docker Image

# =============================================================
# Pipeline ini HANYA berjalan saat kamu membuat Git Tag/Release.
# Contoh: git tag v1.0.0 && git push origin v1.0.0
#
# Memisahkan Docker build dari deploy harian agar pipeline
# sehari-hari tetap cepat (~1-2 menit).
# =============================================================

on:
  push:
    tags:
      - 'v*'   # Trigger pada tag seperti v1.0.0, v1.2.3, v2.0.0-beta

jobs:
  build-docker:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Diperlukan untuk push ke ghcr.io

    steps:
      # 1. Checkout kode
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # 2. Login ke GitHub Container Registry
      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Setup Docker Buildx (untuk build multi-platform)
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Ekstrak metadata (tag & label) dari Git tag
      - name: 🏷️ Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/skywatch-app
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # 5. Build dan Push Docker Image ke ghcr.io
      - name: 🏗️ Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}

      # 6. Tampilkan ringkasan image yang berhasil dibuild
      - name: 📋 Build Summary
        run: |
          echo "## 🐳 Docker Image Released" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${{ github.repository_owner }}/skywatch-app\`" >> $GITHUB_STEP_SUMMARY
          echo "**Pushed tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
